[project]
name = "sally"
version = "0.1.0"
description = "A lightweight, offline-first personal AI assistant built around a modular agent runtime, with memory, tools, voice, and API access."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "llama-cpp-python==0.3.34",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
